plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    version = rootProject.neoforge_version

    parchment.minecraftVersion = rootProject.parchment_mc_version
    parchment.mappingsVersion = rootProject.parchment_version

    runs {
        client {
            client()
            programArguments.addAll '--username', "Player${new Random().nextInt(10000)}"
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        quacksmp {
            sourceSet project.sourceSets.main
        }
    }
}

dependencies {
    // Common module
    compileOnly project(':common')

    // Optional BlueMap Integration
    compileOnly "de.bluecolored:bluemap-api:2.7.3"

    // Optional Simple Voice Chat Integration
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.0"

    // Spark profiler API (compileOnly — runtime provided by the Spark mod)
    compileOnly "me.lucko:spark-api:0.1-SNAPSHOT"
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion

    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: modVersion
    }
}

plugins {
    id 'net.fabricmc.fabric-loom' version '1.16.1' apply false
    id 'net.neoforged.moddev' version '2.0.141' apply false
    id 'com.gradleup.shadow' version '8.3.6' apply false
}

// Timelapse block-colour palette generator (./gradlew generateBlockColors).
apply from: 'scripts/gen_block_colors.gradle'

// ── Dashboard UI build task ──────────────────────────────────────────────────
// Run: ./gradlew npmBuild
// Requires Node.js + npm. Builds the React UI and copies it into the common
// module's resources so it gets bundled into the mod JAR.
// Built assets are committed to git, CI does NOT need Node.js.

def dashboardUiDir  = rootProject.file('dashboard-ui')
def dashboardOutDir = rootProject.file('common/src/main/resources/dashboard')
def isWindows       = System.getProperty('os.name').toLowerCase().contains('windows')
def npmCmd          = isWindows ? ['cmd', '/c', 'npm'] : ['npm']

tasks.register('npmInstall', Exec) {
    group       = 'dashboard'
    description = 'Installs dashboard-ui npm dependencies'
    workingDir  dashboardUiDir
    commandLine(*npmCmd, 'ci')
    inputs.file  "$dashboardUiDir/package.json"
    inputs.file  "$dashboardUiDir/package-lock.json"
    outputs.dir  "$dashboardUiDir/node_modules"
    onlyIf { dashboardUiDir.exists() }
}

tasks.register('npmBuild', Exec) {
    group       = 'dashboard'
    description = 'Builds the React dashboard UI and copies it into common resources'
    dependsOn   'npmInstall'
    workingDir  dashboardUiDir
    commandLine(*npmCmd, 'run', 'build')

    // Never cache, dist/ is outside build/ so clean doesn't wipe it,
    // and Gradle's fingerprinting would silently skip the task on source changes.
    outputs.upToDateWhen { false }

    onlyIf { dashboardUiDir.exists() }

    doLast {
        project.sync {
            from   "$dashboardUiDir/dist"
            into   dashboardOutDir
        }
        logger.lifecycle "[Dashboard] UI built → common/src/main/resources/dashboard/"
    }
}

// ── BlueMap icon export ──────────────────────────────────────────────────────
// Run: ./gradlew exportIcons
// Renders the panel's pixel icons (MinecraftIcons.jsx) to standalone SVGs the BlueMap
// integration uploads to its AssetStorage, so panel and map never fork the art.
// Unlike npmBuild this writes straight into resources, so processResources depends on
// it rather than racing it.

def iconOutDir = rootProject.file('common/src/main/resources/bluemap/icons')

tasks.register('exportIcons', Exec) {
    group       = 'dashboard'
    description = 'Exports panel pixel icons to SVG for BlueMap markers'
    dependsOn   'npmInstall'
    workingDir  dashboardUiDir
    commandLine(*npmCmd, 'run', 'export-icons')

    inputs.file "$dashboardUiDir/src/components/admin/MinecraftIcons.jsx"
    inputs.file "$dashboardUiDir/scripts/export-icons.mjs"
    outputs.dir iconOutDir

    onlyIf { dashboardUiDir.exists() }
}

// The icons are generated into common's resource dir, and the platform modules pull that dir
// into their own compile and packaging tasks, so everything that reads it has to wait for the
// generator. Gradle fails the build rather than racing, so this list has to stay complete.
subprojects {
    tasks.withType(ProcessResources).configureEach { dependsOn rootProject.tasks.named('exportIcons') }
    tasks.withType(JavaCompile).configureEach     { dependsOn rootProject.tasks.named('exportIcons') }
    tasks.withType(Jar).configureEach             { dependsOn rootProject.tasks.named('exportIcons') }
}

allprojects {
    group = rootProject.maven_group
    version = rootProject.mod_version

    repositories {
        mavenCentral()
        maven {
            name = 'NeoForge'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net'
        }
        maven {
            name = 'SpongePowered'
            url = 'https://repo.spongepowered.org/repository/maven-public'
        }
        maven {
            name = 'BlueMap'
            url = 'https://repo.bluecolored.de/releases'
        }
        maven {
            name = 'MaxHenkel'
            url = 'https://maven.maxhenkel.de/repository/public'
        }
        maven {
            name = 'Lucko'
            url = 'https://repo.lucko.me/'
        }
    }
}

subprojects {
    apply plugin: 'maven-publish'

    afterEvaluate {
        base {
            archivesName = "$rootProject.archives_name-$project.name"
        }

        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(25)
            }
            withSourcesJar()
        }

        tasks.withType(JavaCompile).configureEach {
            it.options.release = 25
        }

        // Include common sources in platform projects
        if (project.name != 'common') {
            tasks.named('compileJava').configure {
                source project(':common').sourceSets.main.allSource
            }

            tasks.named('sourcesJar').configure {
                from project(':common').sourceSets.main.allSource
            }

            tasks.withType(ProcessResources).configureEach {
                from project(':common').sourceSets.main.resources
            }
        }

        publishing {
            publications {
                mavenJava(MavenPublication) {
                    artifactId = base.archivesName.get()
                    from components.java
                }
            }
        }
    }
}

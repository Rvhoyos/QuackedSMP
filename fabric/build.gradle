plugins {
    id 'net.fabricmc.fabric-loom'
}

dependencies {
    minecraft "com.mojang:minecraft:${rootProject.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${rootProject.fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${rootProject.fabric_api_version}"

    // Common module
    compileOnly project(':common')

    // Optional BlueMap Integration
    compileOnly "de.bluecolored:bluemap-api:2.7.3"

    // Optional Simple Voice Chat Integration
    compileOnly "de.maxhenkel.voicechat:voicechat-api:2.6.0"

    // Spark profiler API (compileOnly, runtime provided by the Spark mod)
    compileOnly "me.lucko:spark-api:0.1-SNAPSHOT"
}

loom {
    runs {
        client {
            runDir 'runs/client'
            ideConfigGenerated true
            programArg "--username=Player${new Random().nextInt(10000)}"
        }
        server {
            runDir 'runs/server'
            ideConfigGenerated true
        }
    }
}

processResources {
    def modVersion = project.version
    inputs.property 'version', modVersion

    filesMatching('fabric.mod.json') {
        expand version: modVersion
    }
}

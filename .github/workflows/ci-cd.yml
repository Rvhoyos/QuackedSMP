name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  release:
    types: [ "published" ]



jobs:
  build:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build NeoForge with Gradle
        run: ./gradlew :neoforge:build

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v5
        with:
          name: mod-jar
          # Upload only the main jar (exclude dev/sources/shadow)
          path: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*-dev.jar
            !neoforge/build/libs/*-shadow.jar
            !neoforge/build/libs/*-sources.jar
          retention-days: 1

  deploy-staging:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Use specific labels to ensure we hit the right VPS runner
    runs-on: [self-hosted, linux, X64]

    steps:
      - uses: actions/checkout@v5
      
      - name: Download Build Artifact
        uses: actions/download-artifact@v5
        with:
          name: mod-jar
          path: build/libs/

      - name: Deploy to Staging
        run: |
          chmod +x ./scripts/deploy-staging.sh
          ./scripts/deploy-staging.sh "build/libs"

  release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5
      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      # Guard: the tag must match mod_version, or the released jars would report the
      # wrong version to the loader / update-checker. Fail fast instead of shipping drift.
      - name: Verify tag matches mod_version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PROP="$(grep -E '^mod_version' gradle.properties | sed -E 's/.*=[[:space:]]*//')"
          if [ "$TAG" != "$PROP" ]; then
            echo "::error::Tag $GITHUB_REF_NAME (=$TAG) does not match gradle.properties mod_version ($PROP). Bump gradle.properties and re-tag."
            exit 1
          fi

      - name: Build both jars
        run: ./gradlew :fabric:build :neoforge:build

      # Copy the exact main jars by version so sources/dev jars are never picked up.
      - name: Collect release jars
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p release-jars
          cp "fabric/build/libs/quackedsmp-fabric-${VERSION}.jar" release-jars/
          cp "neoforge/build/libs/quackedsmp-neoforge-${VERSION}.jar" release-jars/

      # Created with a PAT (not GITHUB_TOKEN) so the published release triggers deploy-prod.
      - name: Create release and attach jars
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.RELEASE_PAT }}
          files: release-jars/*.jar
          fail_on_unmatched_files: true

  deploy-prod:
    if: github.event_name == 'release'
    runs-on: [self-hosted, linux, X64]

    steps:
      - name: Promote to Production (Run Script)
        run: |
           sudo /usr/local/sbin/promote-to-prod.sh





